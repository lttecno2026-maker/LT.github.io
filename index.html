<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LT TECNO - Sistema de Gestión y Ventas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Pantalla de Selección Inicial - ÚNICO LUGAR CON FONDO VIOLETA */
        #selectionScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            gap: 50px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
        }

        #selectionScreen.hidden {
            display: none;
        }

        .selection-card {
            background: white;
            border-radius: 25px;
            padding: 80px 100px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.4s ease;
            text-align: center;
            min-width: 450px;
            min-height: 550px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .selection-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 35px 100px rgba(0, 0, 0, 0.5);
        }

        .selection-card h2 {
            font-size: 56px;
            margin-bottom: 30px;
            color: #667eea;
            font-weight: 800;
        }

        .selection-card p {
            font-size: 22px;
            color: #555;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .selection-icon {
            font-size: 140px;
            margin-bottom: 40px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* Pantalla de Login */
        #loginScreen {
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
        }

        #loginScreen.active {
            display: flex;
        }

        .login-box {
            background: white;
            border-radius: 25px;
            padding: 60px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            min-width: 500px;
        }

        .login-box h2 {
            color: #667eea;
            margin-bottom: 40px;
            text-align: center;
            font-size: 36px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 16px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            margin-top: 15px;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .error-message {
            color: #e74c3c;
            margin-top: 20px;
            text-align: center;
            display: none;
            font-weight: 600;
        }

        /* Panel del Dueño */
        #ownerPanel {
            display: none;
            background: #f5f7fa;
            min-height: 100vh;
        }

        #ownerPanel.active {
            display: block;
        }

        .header {
            background: white;
            padding: 25px 35px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            color: #667eea;
            font-size: 36px;
            font-weight: 800;
        }

        .nav-tabs {
            display: flex;
            gap: 15px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 14px 28px;
            border: none;
            background: #f5f5f5;
            border-radius: 12px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 700;
            transition: all 0.3s;
            color: #333;
        }

        .nav-tab:hover {
            background: #e0e7ff;
            transform: translateY(-2px);
        }

        .nav-tab.active {
            background: #667eea;
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .content-section {
            display: none;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .content-section.active {
            display: block;
        }

        .section-title {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 4px solid #667eea;
            font-weight: 800;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 25px;
        }

        .price-ranges {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
            border: 2px solid #e0e7ff;
        }

        .price-ranges h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .price-ranges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .price-range-input {
            display: flex;
            flex-direction: column;
        }

        .price-range-input label {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .price-range-input input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn-add {
            background: #10b981;
            color: white;
            padding: 16px 40px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s;
        }

        .btn-add:hover {
            background: #059669;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
        }

        .inventory-list, .clients-list, .sections-list {
            margin-top: 40px;
        }

        .inventory-item, .client-item, .section-item {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }

        .inventory-item:hover, .client-item:hover, .section-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .item-info {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            align-items: center;
        }

        .item-detail {
            display: flex;
            flex-direction: column;
        }

        .item-detail strong {
            color: #667eea;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .item-detail span {
            color: #333;
            font-size: 15px;
        }

        .item-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-edit, .btn-delete, .btn-view, .btn-add-debt {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
        }

        .btn-edit:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-view {
            background: #8b5cf6;
            color: white;
        }

        .btn-view:hover {
            background: #7c3aed;
            transform: translateY(-2px);
        }

        .btn-add-debt {
            background: #f59e0b;
            color: white;
        }

        .btn-add-debt:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .product-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
            margin-right: 20px;
            border: 3px solid #e0e0e0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10001;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 25px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 36px;
            cursor: pointer;
            color: #666;
            font-weight: bold;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #333;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .stat-card h3 {
            font-size: 18px;
            margin-bottom: 15px;
            opacity: 0.95;
            font-weight: 600;
        }

        .stat-card .stat-value {
            font-size: 38px;
            font-weight: 800;
        }

        .period-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .period-btn {
            padding: 12px 25px;
            border: 3px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            font-size: 16px;
        }

        .period-btn:hover, .period-btn.active {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* Panel del Cliente */
        #clientPanel {
            display: none;
            background: #f5f7fa;
            min-height: 100vh;
        }

        #clientPanel.active {
            display: block;
        }

        .client-header {
            background: white;
            padding: 25px 35px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        .client-header h1 {
            color: #667eea;
            font-size: 36px;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-bar {
            display: flex;
            gap: 12px;
            min-width: 350px;
        }

        .search-bar input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-bar button {
            padding: 14px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }

        .search-bar button:hover {
            background: #5568d3;
        }

        .cart-icon {
            position: relative;
            background: #667eea;
            color: white;
            padding: 14px 30px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            font-size: 16px;
        }

        .cart-icon:hover {
            background: #5568d3;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ef4444;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 800;
            border: 3px solid white;
        }

        .sidebar-toggle {
            background: #667eea;
            color: white;
            padding: 14px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 22px;
            font-weight: 800;
            transition: all 0.3s;
        }

        .sidebar-toggle:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .sidebar {
            position: fixed;
            left: -350px;
            top: 0;
            width: 350px;
            height: 100%;
            background: white;
            box-shadow: 8px 0 30px rgba(0, 0, 0, 0.3);
            transition: left 0.4s;
            z-index: 9998;
            padding: 40px 25px;
            overflow-y: auto;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-close {
            text-align: right;
            font-size: 36px;
            cursor: pointer;
            margin-bottom: 30px;
            color: #667eea;
            font-weight: 800;
        }

        .sidebar-close:hover {
            color: #5568d3;
        }

        .sidebar h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 800;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            padding: 18px 20px;
            margin-bottom: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 700;
            color: #333;
            font-size: 16px;
            border: 2px solid transparent;
        }

        .sidebar-menu li:hover {
            background: #e0e7ff;
            color: #667eea;
            border-color: #667eea;
            transform: translateX(10px);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 18px;
            border: 2px solid #e0e0e0;
        }

        .product-card h3 {
            color: #333;
            font-size: 20px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .product-card .category {
            display: inline-block;
            background: #e0e7ff;
            color: #667eea;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .product-card .price {
            color: #667eea;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .product-card .stock {
            color: #10b981;
            font-size: 15px;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .product-card .stock.low {
            color: #f59e0b;
        }

        .product-card .stock.out {
            color: #ef4444;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            justify-content: center;
        }

        .quantity-selector button {
            width: 40px;
            height: 40px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 20px;
            font-weight: 800;
            transition: all 0.3s;
        }

        .quantity-selector button:hover {
            background: #5568d3;
            transform: scale(1.1);
        }

        .quantity-selector input {
            width: 70px;
            text-align: center;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
        }

        .btn-add-cart {
            width: 100%;
            background: #10b981;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .btn-add-cart:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .carousel {
            background: white;
            padding: 35px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .carousel h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 32px;
            font-weight: 800;
        }

        .carousel-container {
            display: flex;
            overflow-x: auto;
            gap: 25px;
            padding: 15px 0;
        }

        .carousel-container::-webkit-scrollbar {
            height: 10px;
        }

        .carousel-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .carousel-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .carousel-container::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }

        .section-container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .section-container h2 {
            color: #667eea;
            margin-bottom: 25px;
            font-size: 32px;
            font-weight: 800;
        }

        .checkout-summary {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-top: 25px;
            border: 2px solid #e0e7ff;
        }

        .checkout-item {
            display: flex;
            justify-content: space-between;
            padding: 18px 0;
            border-bottom: 2px dashed #e0e0e0;
            align-items: center;
        }

        .checkout-item-info {
            flex: 1;
        }

        .checkout-item-info h4 {
            color: #333;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .checkout-item-info p {
            color: #666;
            font-size: 14px;
        }

        .checkout-item-price {
            font-size: 20px;
            font-weight: 800;
            color: #667eea;
        }

        .checkout-total {
            display: flex;
            justify-content: space-between;
            padding: 25px 0;
            font-size: 28px;
            font-weight: 800;
            color: #667eea;
            border-top: 3px solid #667eea;
            margin-top: 15px;
        }

        .radio-group {
            margin: 25px 0;
        }

        .radio-group h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: 800;
        }

        .radio-option {
            display: block;
            padding: 18px 20px;
            margin-bottom: 12px;
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 16px;
        }

        .radio-option:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }

        .radio-option input[type="radio"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .radio-option.selected {
            border-color: #667eea;
            background: #e0e7ff;
        }

        .receipt {
            background: white;
            padding: 50px;
            max-width: 700px;
            margin: 0 auto;
            border: 3px solid #667eea;
        }

        .receipt-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 4px solid #667eea;
            padding-bottom: 25px;
        }

        .receipt-header h1 {
            color: #667eea;
