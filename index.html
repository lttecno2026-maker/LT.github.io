<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LT TECNO - Sistema de Gestión y Tienda Mayorista</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --secondary: #4facfe;
            --secondary-light: #00f2fe;
            --success: #28a745;
            --danger: #f5576c;
            --warning: #ffc107;
            --light: #f5f7fa;
            --dark: #333;
            --gray: #6c757d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ANIMACIONES */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        /* ==================== PANTALLA INICIAL ==================== */
        #pantallaInicial {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .logo-principal {
            position: absolute;
            top: 40px;
            font-size: 3em;
            color: white;
            font-weight: bold;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .opciones-container {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1400px;
            margin-top: 80px;
        }

        .opcion-card {
            background: white;
            border-radius: 30px;
            padding: 80px 60px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            min-width: 400px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .opcion-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .opcion-card:hover::before {
            transform: translateX(100%);
        }

        .opcion-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }

        .opcion-card.dueno {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .opcion-card.cliente {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .opcion-card .icono {
            font-size: 5em;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        .opcion-card h2 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .opcion-card p {
            font-size: 1.3em;
            text-align: center;
            line-height: 1.6;
        }

        /* ==================== LOGIN DUEÑO ==================== */
        #loginDueno {
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 25px;
            padding: 60px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease-out;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header .logo {
            font-size: 2.5em;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .login-header h2 {
            font-size: 2em;
            color: var(--dark);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
            font-size: 1.1em;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--gray);
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
        }

        .error-message {
            color: var(--danger);
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            animation: fadeIn 0.3s;
        }

        /* ==================== PANEL DUEÑO ==================== */
        #panelDueno {
            display: none;
            background: var(--light);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 25px 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 2.2em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 12px 25px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 1em;
        }

        .nav-tab:hover, .nav-tab.active {
            background: white;
            color: var(--primary);
            transform: translateY(-2px);
        }

        .main-content {
            padding: 40px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .content-section {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .content-section.active {
            display: block;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .section-header h2 {
            font-size: 2.5em;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* ==================== INVENTARIO ==================== */
        .add-product-form {
            background: white;
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .add-product-form h3 {
            font-size: 1.8em;
            margin-bottom: 25px;
            color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-row input, .form-row select, .form-row textarea {
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .price-tiers {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            padding: 30px;
            border-radius: 15px;
            margin-top: 25px;
        }

        .price-tiers h4 {
            margin-bottom: 20px;
            color: var(--primary);
            font-size: 1.4em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .price-tier {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }

        .price-tier label {
            font-weight: 600;
            color: var(--dark);
        }

        .price-tier input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .image-upload {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            text-align: center;
        }

        .image-upload input {
            margin-bottom: 15px;
        }

        #imagenPreview {
            max-width: 250px;
            max-height: 250px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 15px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .product-info {
            padding: 25px;
        }

        .product-info h3 {
            font-size: 1.4em;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .product-section {
            display: inline-block;
            padding: 5px 12px;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .product-info p {
            margin: 8px 0;
            color: #666;
            font-size: 1em;
        }

        .product-stock {
            font-weight: 600;
            color: var(--success);
        }

        .product-stock.low {
            color: var(--warning);
        }

        .product-stock.out {
            color: var(--danger);
        }

        .product-prices {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .product-prices h4 {
            font-size: 1em;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .product-prices p {
            font-size: 0.9em;
            margin: 5px 0;
        }

        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-small {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.95em;
        }

        .btn-edit {
            background: var(--secondary);
            color: white;
        }

        .btn-edit:hover {
            background: #3a9de8;
            transform: translateY(-2px);
        }

        .btn-delete {
            background: var(--danger);
            color: white;
        }

        .btn-delete:hover {
            background: #e04558;
            transform: translateY(-2px);
        }

        /* ==================== BALANCE ==================== */
        .balance-filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .balance-filters button {
            padding: 12px 30px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 1em;
        }

        .balance-filters button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .balance-filters button.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-color: var(--primary);
        }

        .balance-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .balance-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
        }

        .balance-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .balance-card.success::before {
            background: linear-gradient(90deg, #28a745 0%, #20c997 100%);
        }

        .balance-card.danger::before {
            background: linear-gradient(90deg, #f5576c 0%, #dc3545 100%);
        }

        .balance-card.warning::before {
            background: linear-gradient(90deg, #ffc107 0%, #ff9800 100%);
        }

        .balance-card .icono {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .balance-card h3 {
            font-size: 1em;
            margin-bottom: 15px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-card .amount {
            font-size: 2.8em;
            font-weight: bold;
            color: var(--dark);
        }

        .balance-chart {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .balance-chart h3 {
            font-size: 1.8em;
            margin-bottom: 30px;
            color: var(--dark);
        }

        .chart-placeholder {
            height: 300px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            font-size: 1.2em;
        }

        .transactions-list {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .transactions-list h3 {
            font-size: 1.8em;
            margin-bottom: 25px;
            color: var(--dark);
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .transaction-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .transaction-info h4 {
            font-size: 1.2em;
            margin-bottom: 5px;
            color: var(--dark);
        }

        .transaction-info p {
            color: #666;
            font-size: 0.95em;
        }

        .transaction-amount {
            font-size: 1.5em;
            font-weight: bold;
        }

        .transaction-amount.positive {
            color: var(--success);
        }

        .transaction-amount.negative {
            color: var(--danger);
        }

        /* ==================== CLIENTES ==================== */
        .client-form {
            background: white;
            padding: 35px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .client-form h3 {
            font-size: 1.8em;
            margin-bottom: 25px;
            color: var(--primary);
        }

        .clients-list {
            display: grid;
            gap: 20px;
        }

        .client-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .client-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .client-info h3 {
            font-size: 1.5em;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .client-info p {
            color: #666;
            font-size: 1.1em;
        }

        .client-details {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .client-debt {
            text-align: center;
        }

        .client-debt p {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .client-debt .amount {
            font-size: 2em;
            font-weight: bold;
            color: var(--danger);
        }

        .client-debt.paid .amount {
            color: var(--success);
        }

        .client-actions {
            display: flex;
            gap: 10px;
        }

        .debt-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border-left: 4px solid var(--danger);
        }

        .debt-item.paid {
            border-left-color: var(--success);
            opacity: 0.6;
        }

        .debt-item p {
            margin: 5px 0;
            font-size: 0.95em;
        }

        /* ==================== PÁGINA CLIENTE ==================== */
        #paginaCliente {
            display: none;
            background: var(--light);
            min-height: 100vh;
        }

        .client-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 25px 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .client-header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .client-header h1 {
            font-size: 2.5em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-actions {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-container {
            position: relative;
        }

        .search-box {
            padding: 14px 45px 14px 20px;
            border: none;
            border-radius: 25px;
            width: 350px;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .cart-icon {
            background: white;
            color: var(--primary);
            padding: 14px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .cart-icon:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--danger);
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(245, 87, 108, 0.4);
        }

        .menu-toggle {
            background: white;
            border: none;
            color: var(--primary);
            font-size: 1.8em;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 12px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .menu-toggle:hover {
            transform: scale(1.1);
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            left: -350px;
            top: 0;
            width: 350px;
            height: 100vh;
            background: white;
            box-shadow: 4px 0 20px rgba(0,0,0,0.15);
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            overflow-y: auto;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 199;
            display: none;
            transition: opacity 0.3s;
        }

        .sidebar-overlay.show {
            display: block;
        }

        .sidebar-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 30px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.6em;
        }

        .close-sidebar {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 1.8em;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .close-sidebar:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }

        .sidebar-menu {
            padding: 25px;
        }

        .sidebar-menu h3 {
            font-size: 1.2em;
            color: var(--gray);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-item {
            padding: 18px 20px;
            margin-bottom: 12px;
