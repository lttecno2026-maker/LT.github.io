<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LT TECNO - Tienda Online</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">LT TECNO</div>
        <nav>
            <input type="text" id="searchBar" placeholder="Buscar productos...">
            <button onclick="toggleCart()">🛒 Carrito (<span id="cartCount">0</span>)</button>
        </nav>
    </header>

    <main id="productGrid">
        <!-- Los productos se cargarán dinámicamente aquí -->
    </main>

    <!-- Modal de Checkout -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <h3>Finalizar Compra - LT TECNO</h3>
            <form id="orderForm">
                <select id="deliveryOption" onchange="updatePaymentMethods()">
                    <option value="retiro">Retiro por sucursal</option>
                    <option value="local">Envío Local (Rosario)</option>
                    <option value="nacional">Envío Nacional</option>
                </select>
                <!-- Inputs de datos aparecerán según la opción -->
                <div id="dynamicFields"></div>
                <button type="submit">Confirmar Pedido</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LT TECNO - Tienda Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos base (añade a tu archivo CSS existente) */
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .producto-card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; }
        .btn-comprar { background: #667eea; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; }
        .modal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <header class="header">
        <h1>LT TECNO</h1>
        <button onclick="openCart()">🛒 Carrito (<span id="cartCount">0</span>)</button>
    </header>

    <input type="text" id="search" placeholder="Buscar productos..." onkeyup="filterProducts()">

    <main class="grid-productos" id="storeContainer"></main>

    <!-- Modal de Checkout -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content" style="background:white; padding:20px; max-width:500px; border-radius:10px;">
            <h3>Finalizar Compra</h3>
            <form id="checkoutForm">
                <select id="deliveryMethod" onchange="toggleDeliveryFields()">
                    <option value="retiro">Retiro por sucursal</option>
                    <option value="local">Envío Local (Rosario)</option>
                    <option value="nacional">Envío Nacional</option>
                </select>
                <div id="deliveryFields"></div>
                <select id="paymentMethod">
                    <option value="transferencia">Transferencia (LT.TECNO2)</option>
                    <option value="mercadopago">Mercado Pago (+6% recargo)</option>
                    <option value="efectivo">Efectivo (Solo retiro)</option>
                </select>
                <button type="button" onclick="finalizePurchase()" class="btn-comprar">Confirmar Compra</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/tienda.js"></script>
</body>
</html>
